name: build-jav-platform

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验源码完整性
        run: |
          for f in src/app.js src/db.js src/scheduler.js src/pipeline.js \
                   src/modules/cdp.js src/modules/mcp115.js \
                   cdp-proxy/cdp-proxy.mjs entrypoint.sh; do
            [ -f "$f" ] || { echo "缺少文件: $f"; exit 1; }
          done
          echo "源码完整"

      - name: 校验补丁已生效
        run: |
          grep -q "process.env.MCP115_TOKEN" src/modules/mcp115.js
          grep -q "process.env.PYTHON_BIN" src/config.js
          grep -q "process.env.REPORT_DIR" src/config.js
          grep -q "process.env.SERVER_HOST" src/config.js
          grep -q "process.env.FFMPEG_BIN" src/modules/javdb.js
          node --check src/app.js
          node --check src/config.js
          node --check src/modules/mcp115.js
          echo "补丁校验通过"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jav-platform:latest
            ghcr.io/${{ github.repository_owner }}/jav-platform:${{ github.run_number }}
